services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - events_data:/data
      - .:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////data/events.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  events_data:
