services:
  web:
    build: .
    image: event_tracker:latest
    command: gunicorn -w 2 -b 0.0.0.0:5000 --timeout 120 wsgi:app
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - events_data:/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////data/events.db
      - OLLAMA_URL=http://ollama:11434
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  scraper:
    build: .
    image: event_tracker:latest
    profiles: ["scraper"]
    volumes:
      - .:/app
      - events_data:/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////data/events.db
      - OLLAMA_URL=http://ollama:11434

  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  events_data:
  ollama_data:
